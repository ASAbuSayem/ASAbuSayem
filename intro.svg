<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#131A35"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D9FF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1E2A4A"/>
    </pattern>
    <clipPath id="typeClip">
      <rect x="60" y="243" height="28" width="0">
        <animate attributeName="width" values="0;400;400;0" keyTimes="0;0.45;0.9;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: Consolas, 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .fade { opacity: 0; animation: fadeUp 0.9s ease forwards; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .node { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pill rect { fill: #121A33; stroke: #2B3A6B; }
    .pill text { fill: #8FB8FF; font-size: 13px; }
  </style>

  <rect width="1000" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1000" height="300" rx="16" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="999" height="299" rx="16" fill="none" stroke="#1E2A4A"/>

  <!-- Left: intro text -->
  <text x="60" y="70" class="mono fade" font-size="16" fill="#00D9FF" opacity="0.85" style="animation-delay:0s">&lt;hello world /&gt;</text>
  <text x="58" y="128" class="sans fade" font-size="52" font-weight="700" fill="url(#nameGrad)" style="animation-delay:0.2s">MD ABU SAYEM</text>
  <text x="60" y="165" class="sans fade" font-size="20" fill="#C9D1D9" style="animation-delay:0.5s">AI / ML Engineer  ·  Researcher  ·  Academic Writer</text>

  <g class="pill sans fade" style="animation-delay:0.8s"><rect x="60" y="188" width="112" height="26" rx="13"/><text x="116" y="206" text-anchor="middle">Deep Learning</text></g>
  <g class="pill sans fade" style="animation-delay:0.95s"><rect x="182" y="188" width="128" height="26" rx="13"/><text x="246" y="206" text-anchor="middle">Medical Imaging</text></g>
  <g class="pill sans fade" style="animation-delay:1.1s"><rect x="320" y="188" width="66" height="26" rx="13"/><text x="353" y="206" text-anchor="middle">GeoAI</text></g>
  <g class="pill sans fade" style="animation-delay:1.25s"><rect x="396" y="188" width="104" height="26" rx="13"/><text x="448" y="206" text-anchor="middle">LLMs &amp; NLP</text></g>

  <text x="60" y="262" class="mono" font-size="17" fill="#7DD3FC" clip-path="url(#typeClip)">&gt; building intelligent systems that matter</text>
  <rect y="247" width="9" height="19" fill="#00D9FF" class="cursor">
    <animate attributeName="x" values="62;462;462;62" keyTimes="0;0.45;0.9;1" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- Right: neural network -->
  <g stroke="#23305A" stroke-width="1.2">
    <line x1="700" y1="95" x2="800" y2="70"/><line x1="700" y1="95" x2="800" y2="125"/><line x1="700" y1="95" x2="800" y2="180"/><line x1="700" y1="95" x2="800" y2="235"/>
    <line x1="700" y1="150" x2="800" y2="70"/><line x1="700" y1="150" x2="800" y2="125"/><line x1="700" y1="150" x2="800" y2="180"/><line x1="700" y1="150" x2="800" y2="235"/>
    <line x1="700" y1="205" x2="800" y2="70"/><line x1="700" y1="205" x2="800" y2="125"/><line x1="700" y1="205" x2="800" y2="180"/><line x1="700" y1="205" x2="800" y2="235"/>
    <line x1="800" y1="70" x2="900" y2="120"/><line x1="800" y1="70" x2="900" y2="180"/>
    <line x1="800" y1="125" x2="900" y2="120"/><line x1="800" y1="125" x2="900" y2="180"/>
    <line x1="800" y1="180" x2="900" y2="120"/><line x1="800" y1="180" x2="900" y2="180"/>
    <line x1="800" y1="235" x2="900" y2="120"/><line x1="800" y1="235" x2="900" y2="180"/>
  </g>

  <g filter="url(#glow)">
    <circle r="3.5" fill="#00D9FF"><animateMotion dur="3s" repeatCount="indefinite" path="M700 95 L800 125 L900 180"/></circle>
    <circle r="3.5" fill="#8B5CF6"><animateMotion dur="3s" begin="0.8s" repeatCount="indefinite" path="M700 205 L800 180 L900 120"/></circle>
    <circle r="3.5" fill="#3B82F6"><animateMotion dur="3s" begin="1.5s" repeatCount="indefinite" path="M700 150 L800 70 L900 120"/></circle>
    <circle r="3.5" fill="#00D9FF"><animateMotion dur="3s" begin="2.2s" repeatCount="indefinite" path="M700 150 L800 235 L900 180"/></circle>
  </g>

  <g filter="url(#glow)">
    <circle cx="700" cy="95" r="8" fill="#00D9FF" class="node" style="animation-delay:0s"/>
    <circle cx="700" cy="150" r="8" fill="#00D9FF" class="node" style="animation-delay:0.3s"/>
    <circle cx="700" cy="205" r="8" fill="#00D9FF" class="node" style="animation-delay:0.6s"/>
    <circle cx="800" cy="70" r="8" fill="#3B82F6" class="node" style="animation-delay:0.9s"/>
    <circle cx="800" cy="125" r="8" fill="#3B82F6" class="node" style="animation-delay:1.2s"/>
    <circle cx="800" cy="180" r="8" fill="#3B82F6" class="node" style="animation-delay:1.5s"/>
    <circle cx="800" cy="235" r="8" fill="#3B82F6" class="node" style="animation-delay:1.8s"/>
    <circle cx="900" cy="120" r="9" fill="#8B5CF6" class="node" style="animation-delay:2.1s"/>
    <circle cx="900" cy="180" r="9" fill="#8B5CF6" class="node" style="animation-delay:2.4s"/>
  </g>

  <text x="800" y="275" text-anchor="middle" class="mono" font-size="12" fill="#4B5A85">input → hidden → output</text>
</svg>
